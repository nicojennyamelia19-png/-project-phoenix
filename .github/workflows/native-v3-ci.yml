name: Phoenix V3 Native CI

on:
  push:
    branches: [phoenix-v3-native]
    paths:
      - "native-v3/**"
      - ".github/workflows/native-v3-ci.yml"
  pull_request:
    paths:
      - "native-v3/**"
      - ".github/workflows/native-v3-ci.yml"
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: native-v3
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: native-v3
        run: |
          set -o pipefail
          xcodebuild \
            -project ProjectPhoenixV3.xcodeproj \
            -scheme ProjectPhoenixV3 \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-v3-build-log
          path: native-v3/xcodebuild.log

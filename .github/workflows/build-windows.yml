name: Build Project Phoenix Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - "package.json"
      - "desktop-main.cjs"
      - "desktop-preload.cjs"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        shell: powershell
        run: npm install

      - name: Construire l’installateur Windows
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:windows

      - name: Publier l’installateur
        uses: actions/upload-artifact@v4
        with:
          name: Project-Phoenix-Windows-Installer
          path: dist-windows/*.exe
          if-no-files-found: error
          retention-days: 30

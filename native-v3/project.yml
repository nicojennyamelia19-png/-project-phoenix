name: ProjectPhoenixV3
options:
  bundleIdPrefix: com.nicolasfontaine
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 3.0.0
    DEVELOPMENT_LANGUAGE: fr
    CODE_SIGN_STYLE: Automatic
targets:
  ProjectPhoenixV3:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WorkoutKit.framework
      - sdk: MapKit.framework
      - sdk: CloudKit.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasfontaine.projectphoenix
        PRODUCT_NAME: Project Phoenix
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Project Phoenix
        CFBundleName: Project Phoenix
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSHealthShareUsageDescription: Project Phoenix lit tes entraînements, ta fréquence cardiaque, ton sommeil, tes pas et tes mesures pour adapter ton suivi.
        NSHealthUpdateUsageDescription: Project Phoenix peut enregistrer les entraînements lancés depuis l'application.
        NSLocationWhenInUseUsageDescription: Project Phoenix utilise ta position pour afficher les parcours de course autorisés dans Apple Santé.
        UIBackgroundModes:
          - processing
    entitlements:
      path: Config/ProjectPhoenix.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.nicolasfontaine.projectphoenix
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.nicolasfontaine.projectphoenix
schemes:
  ProjectPhoenixV3:
    build:
      targets:
        ProjectPhoenixV3: all
    run:
      config: Debug
    archive:
      config: Release
